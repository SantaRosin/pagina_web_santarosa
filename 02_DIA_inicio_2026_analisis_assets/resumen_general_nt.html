<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>body{background-color:white;}</style>

  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Resultados generales por NT</title>
  <style>
        body{margin:0;background:#f8fafc;color:#10233f;font-family:Inter,Segoe UI,sans-serif;}
        .shell{max-width:1600px;margin:0 auto;padding:28px 24px 40px 24px;}
        .hero{background:#fff;border:1px solid #dbe3f1;border-radius:24px;box-shadow:0 20px 48px rgba(15,23,42,.06);padding:22px 24px;margin-bottom:18px;}
        .kicker{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#8b5e34;margin-bottom:8px;}
        h1{margin:0;font-size:32px;line-height:1.05;}
        .note{margin-top:10px;color:#475569;line-height:1.7;font-size:14px;}
        .table-shell{background:#fff;border:1px solid #dbe3f1;border-radius:24px;box-shadow:0 20px 48px rgba(15,23,42,.06);padding:16px;overflow:auto;}
      </style>
</head>
<html>
  <body>
    <div class="shell">
      <div class="hero">
        <div class="kicker">Tabla completa</div>
        <h1>Resultados generales por NT</h1>
        <div class="note">Sintesis porcentual agregada por NT sobre el conjunto de resultados observados.</div>
      </div>
      <div class="table-shell">
        <table style="width:100%;border-collapse:collapse;font-family:Inter,Segoe UI,sans-serif;font-size:14px;">
          <thead>
            <tr>
              <th style="padding:12px 14px;text-align:left;background:#172033;color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.08em;">NT</th>

              <th style="padding:12px 14px;text-align:left;background:#172033;color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.08em;">Consolidando</th>
              <th style="padding:12px 14px;text-align:left;background:#172033;color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.08em;">Profundizando</th>
            </tr>
          </thead>
          <tbody>
            <tr style="background:#ffffff;">
              <td style="padding:10px 14px;border-bottom:1px solid #e2e8f0;vertical-align:top;">NT1</td>
              <td style="padding:10px 14px;border-bottom:1px solid #e2e8f0;vertical-align:top;">58,87%</td>
              <td style="padding:10px 14px;border-bottom:1px solid #e2e8f0;vertical-align:top;">29,65%</td>
              <td style="padding:10px 14px;border-bottom:1px solid #e2e8f0;vertical-align:top;">10,03%</td>
              <td style="padding:10px 14px;border-bottom:1px solid #e2e8f0;vertical-align:top;">1,45%</td>
            </tr>
            <tr style="background:#f8fafc;">
              <td style="padding:10px 14px;border-bottom:1px solid #e2e8f0;vertical-align:top;">NT2</td>
              <td style="padding:10px 14px;border-bottom:1px solid #e2e8f0;vertical-align:top;">21,80%</td>
              <td style="padding:10px 14px;border-bottom:1px solid #e2e8f0;vertical-align:top;">37,47%</td>
              <td style="padding:10px 14px;border-bottom:1px solid #e2e8f0;vertical-align:top;">26,87%</td>
              <td style="padding:10px 14px;border-bottom:1px solid #e2e8f0;vertical-align:top;">13,86%</td>

          </tbody>
        </table>
      </div>
    </div>
